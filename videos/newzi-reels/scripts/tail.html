<script>
(function () {
  var DUR = 520;
  var CH = [0, 104, 208, 312, 416];
  var NAMES = ["Economia", "Tecnologia", "Política", "Negócios", "Ciência"];
  function fmt(x) { x = Math.max(0, x); return Math.floor(x / 60) + ":" + String(Math.floor(x % 60)).padStart(2, "0"); }
  function chapIdx(p) { var c = 0; for (var k = 0; k < CH.length; k++) if (p >= CH[k]) c = k; return c; }
  function byId(id) { return document.getElementById(id); }
  function bars(id, n, hf) {
    var host = byId(id), out = [];
    for (var i = 0; i < n; i++) {
      var b = document.createElement("div");
      b.style.cssText = "width:2.5px;border-radius:2px;height:" + hf(i) + "px";
      host.parentNode.insertBefore(b, host);
      out.push(b);
    }
    return out;
  }
  var H34 = function (i) { return 7 + ((i * 17 + i * i * 3) % 19); };
  var H50 = function (i) { return 6 + ((i * 13 + i * i * 7) % 28); };
  var W = {
    "home-bars": bars("home-bars", 34, H34), "b-home-bars": bars("b-home-bars", 34, H34),
    "pl-bars": bars("pl-bars", 50, H50), "b-pl-bars": bars("b-pl-bars", 50, H50), "c-pl-bars": bars("c-pl-bars", 50, H50)
  };
  function paint(list, frac, off) { for (var i = 0; i < list.length; i++) list[i].style.background = i / list.length < frac ? "#087CF0" : off; }
  function home(pre, p) {
    paint(W[pre + "home-bars"], p / DUR, "#B9CBE3");
    byId(pre + "home-pos").textContent = fmt(p);
    byId(pre + "home-play").style.opacity = p > 0 ? "0" : "1";
    byId(pre + "home-pause").style.opacity = p > 0 ? "1" : "0";
  }
  function player(pre, p) {
    paint(W[pre + "pl-bars"], p / DUR, "#C9D7EA");
    byId(pre + "pl-pos").textContent = fmt(p);
    byId(pre + "pl-rem").textContent = "-" + fmt(DUR - p);
    byId(pre + "pl-chap").textContent = NAMES[chapIdx(p)];
  }
  function mini(id, p) {
    byId(id + "-time").textContent = "30 set · " + fmt(p) + " / 8:40";
    byId(id + "-bar").style.width = (p / DUR * 100).toFixed(1) + "%";
  }

  var tl = gsap.timeline({ paused: true });
  // one briefing session: tapped on Home at 5.95s, then it keeps playing through every scene
  var a = { p: 0 };
  tl.fromTo(a, { p: 0 }, { p: 90, duration: 3.0, ease: "none", onUpdate: function () { home("", a.p); player("", a.p); } }, 5.95);
  var m = { p: 90 };
  tl.fromTo(m, { p: 90 }, { p: 250, duration: 5.6, ease: "none", onUpdate: function () { mini("mp", m.p); } }, 8.6);
  var b = { p: 250 };
  tl.fromTo(b, { p: 250 }, { p: 300, duration: 3.35, ease: "none", onUpdate: function () { home("b-", b.p); player("b-", b.p); mini("am", b.p); } }, 14.0);
  var c = { p: 300 };
  tl.fromTo(c, { p: 300 }, { p: 330, duration: 3.6, ease: "none", onUpdate: function () { player("c-", c.p); } }, 17.0);

  window.__timelines["main"] = tl;
  tl.seek(0);
})();
</script>
