request:
  connect_timeout_seconds: 4
  read_timeout_seconds: 8
  write_timeout_seconds: 4
  pool_timeout_seconds: 2
  source_budget_seconds: 12
  max_response_bytes: 5000000
  max_concurrent_sources: 6
  max_age_days: 30
  user_agent: "NewsEngine/0.1 (RSS collector; respectful low-volume client)"
clustering:
  time_window_hours: 72
  similarity_threshold: 0.42
  token_overlap_threshold: 0.28
ranking:
  topic_relevance: 0.25
  newsworthiness: 0.30
  source_quality: 0.15
  source_diversity: 0.15
  recency: 0.10
  coverage: 0.05
editorial:
  max_items_per_primary_entity: 2
  analysis_penalty: 0.70
  interview_penalty: 0.35
  opinion_penalty: 0.50
  max_roundup_reference_weight: 0.0
